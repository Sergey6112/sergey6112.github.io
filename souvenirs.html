<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>Сувенирная продукция | МОНОПРИНТ</title>
  <meta name="description" content="Сувенирная продукция МОНОПРИНТ: футболки, кружки, ручки, флаги, пакеты и магниты с вашим дизайном.">
  <link rel="canonical" href="https://mono-print.ru/souvenirs.html">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <main class="calculator-shell souvenirs-page">
    <div class="decor-line decor-line--top" aria-hidden="true"></div><div class="decor-line decor-line--bottom" aria-hidden="true"></div><div class="calc-dots" aria-hidden="true"></div>
    <header class="calculator-header"><a class="back-button" href="index.html#catalog-panel" aria-label="Вернуться в каталог"><span aria-hidden="true"></span></a><a class="calculator-logo" href="index.html" aria-label="МОНОПРИНТ - на главную"><img src="assets/logo-monoprint-trimmed.png" alt="МОНОПРИНТ"></a></header>

    <section class="calculator-title"><img src="assets/category-souvenirs.svg" alt="" aria-hidden="true"><div><h1>Сувенирная<br>продукция</h1><p>Нанесём ваш логотип, надпись или изображение</p></div></section>

    <section class="calc-card sign-type-card" aria-labelledby="souvenir-type-title">
      <h2 id="souvenir-type-title">Виды продукции</h2>
      <div class="sign-type-grid souvenir-type-grid">
        <article class="sign-type-button"><img src="assets/souvenir-tshirt.svg" alt=""><strong>Футболки</strong></article>
        <article class="sign-type-button"><img src="assets/souvenir-mug.svg" alt=""><strong>Кружки</strong></article>
        <article class="sign-type-button"><img src="assets/souvenir-pen.svg" alt=""><strong>Ручки</strong></article>
        <article class="sign-type-button"><img src="assets/souvenir-flag.svg" alt=""><strong>Флаги</strong></article>
        <article class="sign-type-button"><img src="assets/souvenir-bag.svg" alt=""><strong>Пакеты</strong></article>
        <article class="sign-type-button"><img src="assets/souvenir-magnet.svg" alt=""><strong>Магниты</strong></article>
      </div>
    </section>

    <p class="souvenir-note">Поможем подобрать основу и способ нанесения под тираж, бюджет и задачу.</p>
    <a class="catalog-return signage-return" href="index.html#catalog-panel">Вернуться в каталог</a>
