<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="МОНОПРИНТ - рекламно-производственная компания в Ростове-на-Дону">
  <title>МОНОПРИНТ</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="taplink" aria-labelledby="brand-title">
    <div class="decor decor-top" aria-hidden="true"></div>
    <div class="decor decor-bottom" aria-hidden="true"></div>
    <div class="dot-pattern" aria-hidden="true"></div>

    <header class="brand">
      <h1 id="brand-title" class="visually-hidden">МОНОПРИНТ</h1>
      <img class="brand-logo" src="assets/logo-monoprint-trimmed.png" alt="МОНОПРИНТ - рекламно-производственная компания">

    <nav class="actions" aria-label="Способы связи">
      <a class="action-card" data-link="max" href="https://max.ru/u/f9LHodD0cOK-8bOsjbWF1MatpsxchI5ix057xEPlfJnU2UN78zfdYixXzE4" target="_blank" rel="noopener noreferrer">
        <span class="service-icon" aria-hidden="true"><img src="assets/max.svg" alt=""></span>
        <span class="action-label">Написать в MAX</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>

      <a class="action-card" data-link="telegram" href="https://t.me/monoprint" target="_blank" rel="noopener noreferrer">
        <span class="service-icon" aria-hidden="true"><img src="assets/telegram.svg" alt=""></span>
        <span class="action-label">Telegram</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>

      <a class="action-card" data-link="vk" href="https://vk.ru/monoprint_rnd" target="_blank" rel="noopener noreferrer">
        <span class="service-icon service-icon--vk" aria-hidden="true"><img src="assets/vk.svg" alt=""></span>
        <span class="action-label">Мы в ВКонтакте</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>

      <a class="action-card" data-link="map" href="https://yandex.ru/maps/-/CTg6rPIj" target="_blank" rel="noopener noreferrer">
        <span class="service-icon service-icon--map" aria-hidden="true"><img src="assets/location-map.svg" alt=""></span>
        <span class="action-label">Мы на картах</span>
        <span class="arrow" aria-hidden="true"></span>
      </a>

      <a class="call-button" data-link="phone" href="tel:+79381114131">Позвонить</a>
    </nav>

    <section class="contacts" aria-label="Контакты">
      <div class="contact-details">
        <span>Ростов-на-Дону, Лермонтовская 125, 4 офис</span>
        <a data-link="phone" href="tel:+79381114131">+7 938 111-41-31</a>

    </section>

  <script src="script.js"></script>
